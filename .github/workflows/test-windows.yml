name: Test Windows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 and MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-gsl

            git
            curl
            make
            autoconf
            automake
            libtool
            bison
            flex

      - name: Install Rust GNU target
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnu


      - name: Build static ViennaRNA for Windows
        run: |
          set -euxo pipefail

          BUILD_ROOT="$RUNNER_TEMP/viennarna-windows-build"
          mkdir -p "$BUILD_ROOT"
          cd "$BUILD_ROOT"

          curl --fail --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            -o ViennaRNA-2.7.0.tar.gz \
            https://github.com/ViennaRNA/ViennaRNA/releases/download/v2.7.0/ViennaRNA-2.7.0.tar.gz

          tar -xf ViennaRNA-2.7.0.tar.gz
          cd ViennaRNA-2.7.0

          export PATH="/mingw64/bin:$PATH"
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig"
          export CPPFLAGS="-I$PWD/src -I/mingw64/include"
          export CXXFLAGS="-include cstdint"
          export CFLAGS="-Wno-error=incompatible-pointer-types"
          export LDFLAGS="-L/mingw64/lib"

            ./configure \
            --prefix="/mingw64" \
            --disable-shared \
            --enable-static \
            --without-openmp \
            --without-swig \
            --without-svm

          # Show the exact callback declarations before patching.
          echo "----- lists.h callback declarations before patch -----"
          grep -n -A2 -B2 -E 'lst_kill|lst_mergesort|freeNode|cmp_func' \
            src/ViennaRNA/datastructures/lists.h || true

          # ViennaRNA 2.7.0 has declarations in lists.h that disagree with
          # the definitions in lists.c under current MinGW GCC.
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ViennaRNA/datastructures/lists.h")
          text = path.read_text()

          replacements = {
              "void (*freeNode) ()": "void (*freeNode)(void *)",
              "int (*cmp_func) ()": "int (*cmp_func)(void *, void *)",
          }

          for old, new in replacements.items():
              if old not in text:
                  print(f"Did not find exact text: {old!r}")
              else:
                  text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          echo "----- lists.h callback declarations after patch -----"
          grep -n -A2 -B2 -E 'lst_kill|lst_mergesort|freeNode|cmp_func' \
            src/ViennaRNA/datastructures/lists.h || true

          # Diagnose generated/internal headers before compiling. Do not add
          # "|| true" to the actual make command below.
          echo "----- Looking for ViennaRNA internal headers -----"
          find src \
            -type f \
            $ \
              -name 'fold_vars.h' \
              -o -name 'fold_vars.h.in' \
              -o -name 'color_output.h' \
              -o -name 'color_output.h.in' \
            $ \
            -print || true

          echo "----- color_output references -----"
          grep -R -n "color_output" src/ViennaRNA 2>/dev/null | head -50 || true

          echo "----- fold_vars references -----"
          grep -R -n "fold_vars" src/ViennaRNA 2>/dev/null | head -50 || true

          # Build sequentially: ViennaRNA 2.7.0 has generated-header races
          # under parallel MinGW/MSYS2 builds.
          make -j1








          RNA_ARCHIVE="$(find . -type f -name libRNA.a -print -quit)"

          if [ -z "$RNA_ARCHIVE" ]; then
            echo "Could not find libRNA.a after building ViennaRNA" >&2
            find . -type f -name 'libRNA*' -print >&2
            exit 1
          fi

          mkdir -p /mingw64/lib
          cp "$RNA_ARCHIVE" /mingw64/lib/libRNA.a

          ls -lah /mingw64/lib/libRNA.a


      - name: Show installed native libraries
        run: |
          ls -lah /mingw64/lib | grep -E 'RNA|gmp|mpfr|gsl' || true
          ls -lah /mingw64/include/ViennaRNA || true

      - name: Copy Windows libraries into expected vendor directory
        run: |
          set -euxo pipefail

          OUT_DIR="$GITHUB_WORKSPACE/vendor/RNAlib/prebuilt/x86_64-pc-windows-gnu"

          mkdir -p "$OUT_DIR"

          cp /mingw64/lib/libRNA.a "$OUT_DIR/"
          cp /mingw64/lib/libgmp.a "$OUT_DIR/"
          cp /mingw64/lib/libmpfr.a "$OUT_DIR/"
          cp /mingw64/lib/libgsl.a "$OUT_DIR/"
          cp /mingw64/lib/libgslcblas.a "$OUT_DIR/"

          ls -lah "$OUT_DIR"

      - name: Build and test
        run: |
          set -euxo pipefail

          export PATH="/mingw64/bin:$PATH"
          export LIBCLANG_PATH="/mingw64/bin"

          cargo test --target x86_64-pc-windows-gnu

