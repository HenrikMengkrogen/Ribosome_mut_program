name: Build Linux ViennaRNA libraries

on:
  workflow_dispatch:

jobs:
  build-linux-libraries:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            curl \
            ca-certificates \
            perl \
            python3 \
            xz-utils \
            bison \
            flex

      - name: Build static GMP, MPFR, GSL, and ViennaRNA
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_ROOT="$RUNNER_TEMP/rna-build"
          PREFIX="$BUILD_ROOT/prefix"

          mkdir -p "$BUILD_ROOT/src" "$PREFIX"

          export PATH="$PREFIX/bin:$PATH"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"

          cd "$BUILD_ROOT/src"

          # GMP
          curl -fL https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz
          tar -xf gmp-6.3.0.tar.xz
          cd gmp-6.3.0

          ./configure \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j"$(nproc)"
          make install

          # MPFR
          cd "$BUILD_ROOT/src"
          curl -fL -o mpfr-4.2.1.tar.xz \
             https://www.mpfr.org/mpfr-4.2.1/mpfr-4.2.1.tar.xz

 	    

          tar -xf mpfr-4.2.1.tar.xz
          cd mpfr-4.2.1

          ./configure \
            --prefix="$PREFIX" \
            --with-gmp="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j"$(nproc)"
          make install

          # GSL
          cd "$BUILD_ROOT/src"
          curl -fL -o gsl-2.8.tar.gz \
            https://ftp.gnu.org/gnu/gsl/gsl-2.8.tar.gz

          tar -xf gsl-2.8.tar.gz
          cd gsl-2.8

          ./configure \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j"$(nproc)"
          make install

          # ViennaRNA
          #
          # IMPORTANT:
          # Use the same ViennaRNA version as your vendored headers.
          #
          cd "$BUILD_ROOT/src"
          curl -fL \
            -o ViennaRNA-2.7.0.tar.gz \
            https://github.com/ViennaRNA/ViennaRNA/releases/download/v2.7.0/ViennaRNA-2.7.0.tar.gz

          tar -xf ViennaRNA-2.7.0.tar.gz
          cd ViennaRNA-2.7.0

          ./configure \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --without-openmp

          make -j"$(nproc)"
          make install

      - name: Collect Linux archives
        shell: bash
        run: |
          set -euxo pipefail

          PREFIX="$RUNNER_TEMP/rna-build/prefix"
          OUT_DIR="vendor/RNAlib/prebuilt/x86_64-unknown-linux-gnu"

          mkdir -p "$OUT_DIR"

          cp \
            "$PREFIX/lib/libRNA.a" \
            "$PREFIX/lib/libgsl.a" \
            "$PREFIX/lib/libgslcblas.a" \
            "$PREFIX/lib/libmpfr.a" \
            "$PREFIX/lib/libgmp.a" \
            "$OUT_DIR/"

          ls -lah "$OUT_DIR"

      - name: Verify Linux object format
        shell: bash
        run: |
          set -euxo pipefail

          mkdir /tmp/rna-library-check
          cd /tmp/rna-library-check

          ar x \
            "$GITHUB_WORKSPACE/vendor/RNAlib/prebuilt/x86_64-unknown-linux-gnu/libRNA.a"

          file *.o | head -n 20

      - name: Upload Linux native libraries
        uses: actions/upload-artifact@v4
        with:
          name: viennarna-x86_64-unknown-linux-gnu
          path: vendor/RNAlib/prebuilt/x86_64-unknown-linux-gnu/
          if-no-files-found: error

