name: Test setup.sh on clean platforms

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  setup-and-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel macOS runner
          - name: macOS Intel
            runner: macos-13

          # Apple Silicon macOS runner
          - name: macOS Apple Silicon
            runner: macos-14

          # Standard Intel Linux runner
          - name: Ubuntu x86_64
            runner: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show machine details
        run: |
          uname -a
          uname -m
          sw_vers || true
          lsb_release -a || true
          command -v brew || true
          command -v clang || true
          command -v pkg-config || true
          command -v cargo || true
          command -v rustc || true

      - name: Run setup
        run: bash setup.sh

      - name: Confirm vendored ViennaRNA package metadata
        run: |
          test -f vendor/RNAlib/lib/libRNA.a
          test -f vendor/RNAlib/include/ViennaRNA/fold.h
          test -f vendor/RNAlib/lib/pkgconfig/RNAlib2.pc

          PKG_CONFIG_PATH="$PWD/vendor/RNAlib/lib/pkgconfig" \
            pkg-config --modversion RNAlib2

          PKG_CONFIG_PATH="$PWD/vendor/RNAlib/lib/pkgconfig" \
            pkg-config --cflags --libs RNAlib2

      - name: Build release executable
        run: cargo build --release -vv

      - name: Test executable
        run: |
          mkdir -p /tmp/ribosome-output
          ./target/release/Ribosome_mut_program misc /tmp/ribosome-output

      - name: Show binary information
        run: |
          file vendor/RNAlib/lib/libRNA.a
          file target/release/Ribosome_mut_program
          otool -L target/release/Ribosome_mut_program || true
          ldd target/release/Ribosome_mut_program || true

